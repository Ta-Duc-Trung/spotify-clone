<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>module2-2</title>
        <link rel="stylesheet" href="./src/style.css" />
    </head>
    <body>
        <div id="app" class="flex h-dvh flex-col">
            <header class="h-16">Header</header>
            <div class="flex h-[calc(100%-8rem)] gap-2">
                <aside class="w-1/4 ml-2">Your library</aside>
                <main
                    class="w-3/4 mr-2 rounded-lg bg-background-card px-10 overflow-y-auto scrollbar-none"
                >
                    <section>
                        <h2
                            class="mt-5 text-2xl font-bold hover:underline hover:cursor-pointer"
                        >
                            Albums
                        </h2>
                        <div
                            id="album-list"
                            class="-ml-3 mt-2 flex overflow-x-auto scrollbar-none items-start"
                        ></div>
                    </section>
                    <section>
                        <h2
                            class="mt-5 text-2xl font-bold hover:underline hover:cursor-pointer"
                        >
                            Artists
                        </h2>
                        <div
                            id="artist-list"
                            class="-ml-3 mt-2 flex overflow-x-auto scrollbar-none items-start"
                        ></div>
                    </section>
                    <section>
                        <h2
                            class="mt-5 text-2xl font-bold hover:underline hover:cursor-pointer"
                        >
                            Tracks
                        </h2>
                        <div
                            id="track-list"
                            class="-ml-3 mt-2 flex overflow-x-auto scrollbar-none items-start"
                        ></div>
                    </section>
                    <section>
                        <h2
                            class="mt-5 text-2xl font-bold hover:underline hover:cursor-pointer"
                        >
                            Playlists
                        </h2>
                        <div
                            id="playlist-list"
                            class="-ml-3 mt-2 flex overflow-x-auto scrollbar-none items-start"
                        ></div>
                    </section>
                </main>
            </div>
            <div class="h-16">Sign up</div>
        </div>

        <script type="module" src="./src/main.js"></script>
    </body>
</html>
